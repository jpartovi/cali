[project]
name = "cali-backend"
version = "0.1.0"
description = "Backend API for Cali - handles Supabase auth and LangGraph agent"
authors = [{ name = "Cali" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.5.0,<3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pyjwt>=2.8.0,<3.0.0",
    "httpx[http2]>=0.27.2",
    "cryptography>=42.0.0",
    "langgraph-sdk>=0.2.9",
    "langgraph>=1.2.15",
    "langchain-core>=1.6.10",
    "google-api-python-client>=2.143.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.3",
    "aiohttp>=3.13.2",
    "python-multipart>=0.0.20",
    "phonenumbers>=8.13.0",
    "typesafe-sdk>=0.7.4",
    "langchain-openai>=1.7.1",
    "langsmith>=0.14.8",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = false
